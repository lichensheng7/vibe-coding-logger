services:
  vibe-coding-logger:
    # 默认拉取 GitHub Actions 构建好的镜像；想本地构建就用 docker compose up -d --build
    image: ${IMAGE:-ghcr.io/lichensheng7/vibe-coding-logger:latest}
    build: .
    container_name: vibe-coding-logger
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18150}:8080"
    env_file: .env
    volumes:
      - ./data:/data
